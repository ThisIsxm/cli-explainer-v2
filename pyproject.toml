[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-explainer-v2"
version = "2.0.0"
description = "Fully AI-driven CLI command explainer - one API call for everything"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ThisIsxm"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
keywords = ["cli", "command", "explainer", "ai", "llm"]
dependencies = [
    "litellm>=1.40.0",
    "rich>=13.7.0",
    "pyperclip>=1.8.2",
    "keyboard>=0.13.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ThisIsxm/cli-explainer-v2"
Repository = "https://github.com/ThisIsxm/cli-explainer-v2"
Issues = "https://github.com/ThisIsxm/cli-explainer-v2/issues"

[project.scripts]
cli-explainer = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
